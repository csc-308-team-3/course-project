name: CI Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint backend/root project
        run: npm run lint
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test project
        run: npm test
      